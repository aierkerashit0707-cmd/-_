<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <div class="loader">
        <div class="outer-ring"></div>
        <div class="inner-ring"></div>
    </div>



    <div class="clock">
        <div class="number num-12">12</div>
        <div class="number num-3">3</div>
        <div class="number num-6">6</div>
        <div class="number num-9">9</div>

        <div class="hand hour-hand"></div>
        <div class="hand minute-hand"></div>
        <div class="hand second-hand"></div>

        <div class="center-dot"></div>
    </div>



    <div class="loader">
        <div class="ball ball-left"></div>
        <div class="ball ball-num1"></div>
         <div class="ball ball-num2"></div>
          <div class="ball ball-num3"></div>
           <div class="ball ball-num4"></div>
            <div class="ball ball-right"></div>
    </div>

</body>
</html>
